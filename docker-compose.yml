services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outlet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outlet}
      POSTGRES_DB: ${POSTGRES_DB:-outlet_manager}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3050
      DATABASE_URL: postgresql://${POSTGRES_USER:-outlet}:${POSTGRES_PASSWORD:-outlet}@db:5432/${POSTGRES_DB:-outlet_manager}?schema=public
      CORS_ORIGINS: ${DOCKER_CORS_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: "1"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      AUTH_SEED_EMAIL: ${AUTH_SEED_EMAIL:-}
      AUTH_SEED_PASSWORD: ${AUTH_SEED_PASSWORD:-}
    volumes:
      - uploads:/app/backend/uploads
    ports:
      - "${API_PORT:-3050}:3050"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api/v1/
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${UI_PORT:-3000}:80"

volumes:
  db-data:
  uploads:
